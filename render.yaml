services:
  - type: web
    name: logsense
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
      # Render's Starter instance has 0.5 CPU but containers often still
      # report the host's full core count, so torch/numpy's BLAS/OpenMP
      # layers auto-size thread pools too large — each extra thread adds
      # memory overhead on top of what the model itself needs, which is
      # what pushed a 512MB instance into OOM during startup. Capping
      # every thread pool to 1 keeps the footprint to what the model
      # actually requires.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
