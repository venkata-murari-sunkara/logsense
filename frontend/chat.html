<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>LogSense — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=1794427662" />
</head>
<body>
  <div class="ls-shell">
    <aside class="ls-sidebar">
      <a href="index.html" class="ls-brand">LogSense</a>
      <nav class="ls-nav">
        <div class="ls-nav-header">Monitor</div>
        <a href="dashboard.html">Dashboard</a>
        <a href="priorities.html">Priorities <span class="ls-badge" id="nav-priorities-badge" hidden></span></a>
        <div class="ls-nav-header">Investigate</div>
        <a href="analyze.html">Analyze</a>
        <a href="history.html">History</a>
        <a href="chat.html" class="active">Chat</a>
        <div class="ls-nav-header">Model</div>
        <a href="evaluate.html">Evaluation</a>
        <a href="reports.html">Reports</a>
      </nav>
      <div class="ls-sidebar-info">
        <strong>Dataset · HDFS</strong>
        <div class="ls-mono">575,061 blocks indexed</div>
        <div class="ls-dot-row"><span class="ls-dot"></span>Retriever online</div>
      </div>
    </aside>

    <main class="ls-main">
      <header class="ls-row" style="justify-content: space-between;">
        <div class="ls-row" style="flex: 1; min-width: 240px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 0.75rem;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-faint); flex: none;"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="topbar-search" placeholder="Search a block ID and press Enter" style="flex: 1; border: 0; outline: 0; background: transparent; padding: 0.65rem 0;" />
        </div>
        <a class="ls-btn" href="analyze.html">+ Analyze a block</a>
      </header>

      <div class="ls-header">
        <h1>Ask LogSense</h1>
        <p>Ask questions about blocks, incidents and trends in plain language.</p>
      </div>

      <div class="ls-card" style="padding: 0; overflow: hidden;">
        <div id="chat-messages" style="max-height: 55vh; overflow-y: auto; padding: 1.25rem;"></div>
        <div id="chat-suggestions" style="padding: 0 1.25rem 1.1rem; display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
        <div style="border-top: 1px solid var(--border); padding: 0.9rem 1.25rem; display: flex; gap: 0.6rem;">
          <input type="text" id="chat-input" placeholder="Ask about a block, a DataNode, or today's incidents…" style="flex: 1;" />
          <button class="ls-btn" id="chat-send-btn">Send</button>
          <button class="ls-btn ls-btn-ghost" id="chat-clear-btn">Clear</button>
        </div>
      </div>
      <footer class="ls-footer">LogSense · v1.0 · Clark University</footer>
    </main>
  </div>

  <script src="js/api.js?v=1794427662"></script>
  <script src="js/chat.js?v=1794427662"></script>
</body>
</html>
