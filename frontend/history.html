  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=1793636241" />
</head>
<body>
  <div class="ls-shell">
    <aside class="ls-sidebar">
      <div class="ls-brand">LogSense</div>
      <nav class="ls-nav">
        <div class="ls-nav-header">Monitor</div>
        <a href="index.html">Dashboard</a>
        <a href="priorities.html">Priorities <span class="ls-badge" id="nav-priorities-badge" hidden></span></a>
        <div class="ls-nav-header">Investigate</div>
        <a href="analyze.html">Analyze</a>
        <a href="history.html" class="active">History</a>
        <a href="chat.html">Chat</a>
        <div class="ls-nav-header">Model</div>
        <a href="evaluate.html">Evaluation</a>
        <a href="reports.html">Reports</a>
      </nav>
      <div class="ls-sidebar-info">
        <strong>Dataset · HDFS</strong>
        <div class="ls-mono">575,061 blocks indexed</div>
        <div class="ls-dot-row"><span class="ls-dot"></span>Retriever online</div>
      </div>
    </aside>

    <main class="ls-main">
      <div class="ls-header">
        <h1>Analysis history</h1>
        <p>Every block analyzed so far, with its verdict and explanation.</p>
      </div>

      <div id="analysis-detail"></div>

      <div class="ls-section-title">All analyses</div>
      <div class="ls-row" style="margin-bottom: 1rem;">
        <label class="ls-muted" for="verdict-filter">Verdict:</label>
        <select id="verdict-filter">
          <option value="">All</option>
          <option value="Anomaly">Anomaly</option>
          <option value="Normal">Normal</option>
        </select>
        <label class="ls-muted" for="reviewed-filter">Reviewed:</label>
        <select id="reviewed-filter">
          <option value="">All</option>
          <option value="true">Reviewed</option>
        </select>
      </div>
      <div id="history-list"></div>
      <div class="ls-pagination" id="pagination"></div>
      <footer class="ls-footer">LogSense · v1.0 · Clark University</footer>
    </main>
  </div>

  <script src="js/api.js?v=1793636241"></script>
  <script src="js/history.js?v=1793636241"></script>
</body>
</html>
